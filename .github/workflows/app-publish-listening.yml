# GENERATED by tools/public_ci.py from evolve-english-app/.github/workflows/publish-listening.yml - edit the source, not this copy.
# Publish listening course text + audio to the public update repo, without building a new app.
# The app picks new/updated courses up in its daily update check.
name: Publish listening content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    # A commit that also ships a new app build is published by android.yml; skip it here so the two don't race.
    runs-on: ubuntu-latest
    env:
      UPDATES_TOKEN: ${{ secrets.SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: infcreative-Ethan/evolve-english-app
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 1
      - name: Publish
        shell: bash
        run: |
          set -e
          git config --global user.name "app-builder"
          git config --global user.email "actions@users.noreply.github.com"
          git clone -q "https://x-access-token:${UPDATES_TOKEN}@github.com/infcreative-Ethan/evolve-english-updates.git" updates
          cd updates
          mkdir -p packs
          for pair in voa-raw:lle1:voa_raw voa-lle2:lle2:raw voa-aii:aii:raw voa-ams:ams:raw; do
            IFS=: read br id dir <<< "$pair"
            git -C .. fetch -q --depth 1 origin "$br:$br" 2>/dev/null || continue
            rm -rf ../_a && mkdir -p ../_a && git -C .. --work-tree=_a checkout "$br" -- "$dir" 2>/dev/null || continue
            mkdir -p "voa/$id"
            # Only the audio a published course lists (raw branches also hold articles we chose not to use).
            [ -e "../content/listen-$id.json" ] || continue
            for b in $(python3 -c "import json;print(' '.join(l['file'] for l in json.load(open('../content/listen-$id.json'))['lessons']))"); do
              [ -e "../_a/$dir/$b" ] && { [ -e "voa/$id/$b" ] || cp "../_a/$dir/$b" "voa/$id/$b"; }
            done
          done
          rm -rf ../_a
          for f in ../content/listen-*.json; do python3 -c "import json,sys;sys.exit(0 if json.load(open('$f'))['lessons'] else 1)" && cp "$f" packs/; done
          cp ../content/evolve-*.json packs/
          python3 - <<'PY'
          import json, glob, os
          repo = 'infcreative-Ethan/evolve-english-updates'
          m = json.load(open('latest.json', encoding='utf-8'))
          allc = [{'id': c['id'], 'version': c['version'], 'url': f'https://raw.githubusercontent.com/{repo}/main/packs/listen-{c["id"]}.json'}
                  for c in (json.load(open(f, encoding='utf-8')) for f in sorted(glob.glob('packs/listen-*.json')))]
          # textbooks: every evolve-N pack (books 2-6 arrive this way, without a new app)
          m['packs'] = [{'packId': p['packId'], 'version': p['version'], 'url': f'https://raw.githubusercontent.com/{repo}/main/packs/{os.path.basename(f)}'}
                        for f, p in ((f, json.load(open(f, encoding='utf-8'))) for f in sorted(glob.glob('packs/evolve-*.json')))]
          m['courses'] = allc                                   # app 1.14+: every course
          m['listen'] = [c for c in allc if c['id'] == 'lle1']  # app 1.13 only understands Level 1
          json.dump(m, open('latest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(allc)
          PY
          git add -A
          git commit -qm "Listening content update" || { echo "nothing to publish"; exit 0; }
          for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((RANDOM % 30 + 10)); done
          exit 1
