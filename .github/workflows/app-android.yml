# GENERATED by tools/public_ci.py from evolve-english-app/.github/workflows/android.yml - edit the source, not this copy.
# Builds the Android installer (APK) on GitHub's servers.
# Every push to main (or a manual run from the Actions tab) produces a new APK,
# attached to a GitHub Release so it can be downloaded straight to the phone.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPDATES_TOKEN: ${{ secrets.SOURCE_TOKEN != '' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: infcreative-Ethan/evolve-english-app
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Set version
        shell: bash
        run: |
          # minutes since 2026-01-01 UTC: always grows, so Android accepts each build as an update
          echo "VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"
          echo "APP_VERSION=1.$(( ${{ github.run_number }} + 32 )) ($(TZ=Asia/Shanghai date +%Y.%-m.%-d))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        shell: bash
        run: |
          set -o pipefail
          {
            npm install --legacy-peer-deps
            npx expo install expo-application expo-asset expo-audio expo-constants expo-document-picker expo-file-system expo-intent-launcher expo-sharing expo-speech expo-status-bar react-native-svg react-native-safe-area-context @react-native-async-storage/async-storage react react-native -- --legacy-peer-deps
            npx expo install --check || npx expo install --fix -- --legacy-peer-deps
          } 2>&1 | tee build.log
          echo "::notice title=versions::$(npm ls expo expo-asset expo-audio expo-constants expo-file-system react-native --depth=0 2>/dev/null | tr '\n' ' ')"

      - name: Diagnose native modules
        shell: bash
        run: |
          node -e "
          const r=require('child_process').execSync('npx expo-modules-autolinking resolve --platform android --json',{encoding:'utf8'});
          const j=JSON.parse(r); const lines=j.modules.map((m,i)=>i+' '+m.packageName+'@'+m.packageVersion+' pub='+JSON.stringify((m.projects||[]).map(p=>p.publication||null)));
          console.log('::notice title=modules::'+lines.join(' | '));
          " || true
          echo "::notice title=autolinking::$(npm ls expo-modules-autolinking --all 2>/dev/null | tr '\n' ' ')"
          for f in $(find node_modules -name expo-module.config.json -not -path '*/node_modules/*/node_modules/*/node_modules/*'); do if grep -q publication "$f"; then echo "::notice title=pub::$f $(tr -d '\n ' < $f)"; fi; done

      - name: Build content pack
        run: node content/build.js

      - name: Generate the Android project
        run: |
          npx expo prebuild --platform android --clean --no-install
          # phones only (no x86 emulators): keeps the speech engine from doubling the APK size
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties
          # also sign the old way (v1/JAR): Honor and some Huawei installers refuse an APK
          # without it ("该安装包未包含任何证书")
          sed -i "s/^\(\s*\)keyPassword 'android'/&\n\1enableV1Signing true\n\1enableV2Signing true/" android/app/build.gradle
          grep -n -A1 "enableV1Signing" android/app/build.gradle

      - name: Use the app's permanent signing key
        run: cp credentials/app.keystore android/app/debug.keystore

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          touch build.log
          { grep -n -B2 -A25 -E "What went wrong|error:|Error:|ERROR|npm error|ERESOLVE|CommandError|Unable to resolve|SyntaxError|e: " build.log | head -150 || true; echo '--- tail ---'; tail -60 build.log; } > errors.txt
          python3 - <<'EOF'
          text = open('errors.txt', encoding='utf-8', errors='replace').read()
          chunks = [text[i:i+6000] for i in range(0, len(text), 6000)][:8]
          for n, c in enumerate(chunks):
              c = c.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=build-log-{n}::{c}')
          EOF

      - name: Name the APK
        run: |
          mkdir -p dist
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'META-INF/[^/]+\.(RSA|EC|DSA)$' || { echo '::error::APK has no v1 signature'; exit 1; }
          cp android/app/build/outputs/apk/release/app-release.apk "dist/english-app-$(( ${{ github.run_number }} + 32 )).apk"

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # the APK is also attached to the release below
        with:
          name: english-app-apk
          path: dist/*.apk
          retention-days: 3

      # ---- online update: publish to the public repo the app checks ----
      - name: Prepare the public update repository
        id: upd
        if: env.HAS_UPDATES_TOKEN == 'true' && github.ref == 'refs/heads/main'
        env:
          UPDATES_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        shell: bash
        run: |
          set -e
          git config --global user.name "app-builder"
          git config --global user.email "actions@users.noreply.github.com"
          git clone "https://x-access-token:${UPDATES_TOKEN}@github.com/infcreative-Ethan/evolve-english-updates.git" updates
          cd updates
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            git checkout -B main
            printf '# Go to America App 更新\n\nApp 会自动从这里检查新版本。手动下载：打开 Releases，下载最新的 .apk。\n' > README.md
            git add README.md && git commit -m "Initial commit" && git push -u origin main
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Publish the APK to the public repository
        if: steps.upd.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          repository: infcreative-Ethan/evolve-english-updates
          token: ${{ secrets.SOURCE_TOKEN }}
          tag_name: v${{ env.VERSION_CODE }}
          name: Go to America ${{ env.APP_VERSION }}
          body: 在 App 的「我的 → 在线更新」里可直接更新；也可下载 apk 覆盖安装。学习进度会保留。
          files: dist/*.apk

      - name: Publish latest.json and the content pack
        if: steps.upd.outputs.ok == '1'
        shell: bash
        run: |
          set -e
          APK=$(ls dist/*.apk | head -1); NAME=$(basename "$APK"); SIZE=$(stat -c %s "$APK")
          # listening audio (VOA, public domain) lives on voa-* branches; publish any file not yet published
          cd updates
          mkdir -p packs
          for pair in voa-raw:lle1:voa_raw voa-lle2:lle2:raw voa-aii:aii:raw voa-ams:ams:raw; do
            IFS=: read br id dir <<< "$pair"
            git -C .. fetch -q --depth 1 origin "$br:$br" 2>/dev/null || continue
            rm -rf ../_a && mkdir -p ../_a && git -C .. --work-tree=_a checkout "$br" -- "$dir" 2>/dev/null || continue
            mkdir -p "voa/$id"
            # Only the audio a published course lists (raw branches also hold articles we chose not to use).
            [ -e "../content/listen-$id.json" ] || continue
            for b in $(python3 -c "import json;print(' '.join(l['file'] for l in json.load(open('../content/listen-$id.json'))['lessons']))"); do
              [ -e "../_a/$dir/$b" ] && { [ -e "voa/$id/$b" ] || cp "../_a/$dir/$b" "voa/$id/$b"; }
            done
          done
          rm -rf ../_a
          cp ../content/evolve-*.json packs/
          for f in ../content/listen-*.json; do python3 -c "import json,sys;sys.exit(0 if json.load(open('$f'))['lessons'] else 1)" && cp "$f" packs/; done
          export NAME SIZE
          python3 - <<'PY'
          import json, os, subprocess, glob
          try:
              msg = open('../UPDATE_NOTES.txt', encoding='utf-8').read().strip().splitlines()[0]
          except Exception:
              msg = subprocess.run(['git', '-C', '..', 'log', '-1', '--pretty=%s'], capture_output=True, text=True).stdout.strip()
          pack = json.load(open('packs/evolve-1.json', encoding='utf-8'))
          repo = 'infcreative-Ethan/evolve-english-updates'
          vc = int(os.environ['VERSION_CODE'])
          m = {
            'versionCode': vc,
            'version': os.environ['APP_VERSION'],
            'notes': msg[:120],
            'apkUrl': f"https://github.com/{repo}/releases/download/v{vc}/{os.environ['NAME']}",
            'apkSize': int(os.environ['SIZE']),
            'packs': [{'packId': q['packId'], 'version': q['version'], 'url': f'https://raw.githubusercontent.com/{repo}/main/packs/{os.path.basename(f)}'}
                      for f, q in ((f, json.load(open(f, encoding='utf-8'))) for f in sorted(glob.glob('packs/evolve-*.json')))],
            'courses': [{'id': c['id'], 'version': c['version'], 'url': f'https://raw.githubusercontent.com/{repo}/main/packs/listen-{c["id"]}.json'} for c in (json.load(open(f, encoding='utf-8')) for f in sorted(glob.glob('packs/listen-*.json')))],
            'listen': [{'id': 'lle1', 'version': json.load(open('packs/listen-lle1.json', encoding='utf-8'))['version'], 'url': f'https://raw.githubusercontent.com/{repo}/main/packs/listen-lle1.json'}],
          }
          json.dump(m, open('latest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          git add latest.json packs voa
          git commit -m "Release ${APP_VERSION}"
          # audio jobs push to the same repository: rebase and retry
          for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((RANDOM % 30 + 10)); done
          exit 1
