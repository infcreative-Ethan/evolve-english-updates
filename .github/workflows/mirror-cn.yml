# Copies everything the app downloads (update list, content packs, audio, APK, speech model)
# to the family's server in Shanghai, so phones in mainland China can download without a VPN.
# Runs here in the public update repository (free build minutes) whenever new files are published.
name: Mirror to China server

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: mirror-cn
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HOST: '101.35.43.66'
      KEY: ${{ secrets.EVOLVE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          [ -n "$KEY" ] || { echo "::error::EVOLVE_SSH_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh
          # a key copied on a phone may lose its line breaks: rebuild the standard layout
          python3 - <<'PY'
          import base64, os, re
          k = os.environ['KEY'].replace('\r', '').strip()
          m = re.search(r'-----BEGIN OPENSSH PRIVATE KEY-----(.*?)-----END OPENSSH PRIVATE KEY-----', k, re.S)
          if m:  # the key as printed (its line breaks may have been lost on a phone)
              body = re.sub(r'[^A-Za-z0-9+/=]', '', m.group(1))
              pem = '-----BEGIN OPENSSH PRIVATE KEY-----\n' + '\n'.join(body[i:i + 70] for i in range(0, len(body), 70)) + '\n-----END OPENSSH PRIVATE KEY-----\n'
          elif re.fullmatch(r'[A-Za-z0-9+/=\s]{200,}', k):  # the whole key file as one base64 word
              pem = base64.b64decode(re.sub(r'\s', '', k)).decode()
          else:
              pem = ''
              print('secret is not a key: length', len(k), 'looks like a web address' if 'http' in k else '')
          open(os.path.expanduser('~/.ssh/evolve'), 'w').write(pem)
          PY
          chmod 600 ~/.ssh/evolve
          ssh-keygen -y -f ~/.ssh/evolve >/dev/null || { echo "::error::EVOLVE_SSH_KEY is not a valid key - copy it again from the key page"; exit 1; }
          echo "key format ok"
          ssh-keyscan -T 30 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          curl -sS --max-time 20 "http://$HOST:8686/ok.txt"
      - name: Collect the files
        run: |
          rsync -a --exclude .git --exclude .github --exclude .mirror ./ mirror/
          python3 .mirror/mirror_cn.py mirror
          du -sh mirror
      - name: Upload (many connections at once; most needed first)
        run: |
          SSH="ssh -i $HOME/.ssh/evolve -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30"
          python3 .mirror/mirror_push.py mirror "evolve@$HOST" "$SSH"
          # remove files that are no longer published (best effort)
          timeout 900 rsync -r --delete --existing --ignore-existing --timeout=120 --exclude ok.txt --exclude 'k-*.txt' -e "$SSH" mirror/ "evolve@$HOST:/" || true
          curl -sS --max-time 20 "http://$HOST:8686/latest.json" | head -c 120; echo
