# GENERATED by tools/public_ci.py from evolve-english-app/.github/workflows/tts.yml - edit the source, not this copy.
# Reads every textbook word, sentence and dialogue line with an open TTS model and publishes
# the audio to the public update repository (folder tts/), where the app downloads it as needed.
name: Publish textbook pronunciation audio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      UPDATES_TOKEN: ${{ secrets.SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: infcreative-Ethan/evolve-english-app
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile "misaki[en]"
      - name: Read and publish
        shell: bash
        run: |
          set -e
          git config --global user.name "app-builder"
          git config --global user.email "actions@users.noreply.github.com"
          git clone -q --depth 1 "https://x-access-token:${UPDATES_TOKEN}@github.com/infcreative-Ethan/evolve-english-updates.git" updates
          python tools/tts/gen.py updates/tts ${{ matrix.shard }} 6
          cd updates
          git add -A tts
          git commit -qm "Textbook pronunciation audio (part ${{ matrix.shard }})" || { echo "nothing new"; exit 0; }
          # other parts and app builds push to the same repository: rebase and retry
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
